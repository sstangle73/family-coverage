name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is the commit count
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null
      - name: Unit tests, lint and debug builds (both flavors)
        run: ./gradlew --no-daemon testFullDebugUnitTest testPlayDebugUnitTest lintFullDebug lintPlayDebug assembleFullDebug assemblePlayDebug
      - name: Server tests
        run: python3 -m unittest discover -s server -p "test_*.py" -v
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
