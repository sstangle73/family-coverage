<!doctype html>
<!-- The 1024 x 500 feature graphic for Google Play and F-Droid (fastlane/.../images/featureGraphic.png).
     Render: msedge --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1024,500
     --screenshot=featureGraphic.png store/feature-graphic.html. Nothing promotional in it ("free", "best"):
     Play's metadata policy. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature graphic</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; background: #1D5FA6; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { display: flex; align-items: center; height: 100%; padding: 0 72px; box-sizing: border-box; gap: 56px; }
  svg { flex: none; }
  h1 { margin: 0 0 18px; color: #FFFFFF; font-size: 68px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.05; }
  p { margin: 0; color: #EAF1FA; font-size: 32px; line-height: 1.3; font-weight: 400; max-width: 560px; }
</style>
</head>
<body>
  <div class="wrap">
    <!-- The launcher icon's art: three white bars, the tallest yellow, on a baseline. -->
    <svg width="230" height="230" viewBox="28 36 50 50" aria-hidden="true">
      <rect x="33" y="66" width="7" height="10" fill="#FFFFFF"/>
      <rect x="44" y="58" width="7" height="18" fill="#FFFFFF"/>
      <rect x="55" y="49" width="7" height="27" fill="#FFFFFF"/>
      <rect x="66" y="40" width="7" height="36" fill="#FFD166"/>
      <rect x="31" y="79" width="44" height="3" fill="#FFFFFF"/>
    </svg>
    <div>
      <h1>Family Coverage</h1>
      <p>Which mobile network works where your family actually goes?</p>
    </div>
  </div>
</body>
</html>
